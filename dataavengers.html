<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Avengers Initiative</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

background:
radial-gradient(circle at top,
#1c5e9f,
#071b2f);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

color:white;

}

.card{

width:100%;
max-width:450px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

padding:30px;

border-radius:24px;

text-align:center;

box-shadow:
0 0 20px rgba(65,182,230,.4);

}

.logo{

font-size:70px;

}

h1{

margin:15px 0;

font-size:2rem;

}

p{

line-height:1.6;

opacity:.9;

}

button{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:14px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:#005EB8;

color:white;

}

button:hover{

background:#003087;

}

.challenge{

font-size:48px;

font-weight:bold;

margin:25px 0;

}

input{

width:100%;

padding:15px;

font-size:22px;

text-align:center;

border-radius:12px;

border:none;

margin-top:10px;

}

.hidden{

display:none;

}

.team-icon{

font-size:90px;

margin-bottom:10px;

}

.team-name{

font-size:36px;

font-weight:900;

margin-bottom:15px;

}

.table{

font-size:20px;

font-weight:600;

}

.footer{

margin-top:15px;

font-size:14px;

opacity:.7;

}

.loading{

font-size:22px;

margin-top:20px;

}

</style>

</head>

<body>

<div class="card">

<div id="welcomeScreen">

<div class="logo">🛡️</div>

<h1>Avengers Initiative</h1>

<p>

Welcome Recruit.

<br><br>

Complete your S.H.I.E.L.D verification challenge to
discover your Avengers team.

</p>

<button onclick="generateChallenge()">

Begin Verification

</button>

</div>


<div id="challengeScreen" class="hidden">

<h2>S.H.I.E.L.D Verification</h2>

<div id="challenge"
class="challenge">
</div>

<input
type="number"
id="answerInput"
placeholder="Enter your answer">

<button onclick="verifyAnswer()">

Verify Identity

</button>

</div>


<div id="resultScreen" class="hidden">

<div id="teamIcon"
class="team-icon">
</div>

<div id="teamName"
class="team-name">
</div>

<div id="tableInfo"
class="table">
</div>

<div class="footer">

Report to your allocated team area.

</div>

</div>

</div>

<script>

let correctAnswer;

const teams = {

1:{
name:"TEAM HULK",
icon:"💚",
table:"Table A"
},

2:{
name:"TEAM IRON MAN",
icon:"🤖",
table:"Table B"
},

3:{
name:"TEAM CAPTAIN AMERICA",
icon:"🛡️",
table:"Table C"
},

4:{
name:"TEAM BLACK PANTHER",
icon:"🐾",
table:"Table D"
},

5:{
name:"TEAM SPIDER-MAN",
icon:"🕸️",
table:"Table E"
}

};

function generateChallenge(){

document
.getElementById("welcomeScreen")
.classList.add("hidden");

document
.getElementById("challengeScreen")
.classList.remove("hidden");

/*
Generates answer between 1 and 5
*/

correctAnswer =
Math.floor(Math.random()*5)+1;

const largerNumber =
Math.floor(Math.random()*50)+50;

const smallerNumber =
largerNumber - correctAnswer;

document
.getElementById("challenge")
.innerHTML =
`${largerNumber} - ${smallerNumber} = ?`;

}

function verifyAnswer(){

const entered =
parseInt(
document
.getElementById("answerInput")
.value
);

if(isNaN(entered)){

alert(
"Please enter an answer."
);

return;
}

if(entered !== correctAnswer){

alert(
"Incorrect answer. Please try again."
);

return;
}

document
.getElementById("challengeScreen")
.classList.add("hidden");

const selectedTeam =
teams[correctAnswer];

document
.getElementById("teamIcon")
.innerHTML =
selectedTeam.icon;

document
.getElementById("teamName")
.innerHTML =
selectedTeam.name;

document
.getElementById("tableInfo")
.innerHTML =
`Proceed to ${selectedTeam.table}`;

document
.getElementById("resultScreen")
.classList.remove("hidden");

}

</script>

</body>

</html>
