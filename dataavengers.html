<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Avengers Initiative</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

background:
radial-gradient(circle at top,
#1f5f9d,
#071b2f);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

}

.card{

width:100%;
max-width:420px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:24px;

padding:30px;

text-align:center;

box-shadow:
0 0 20px rgba(65,182,230,.3);

}

.logo{

font-size:70px;
margin-bottom:10px;

}

h1{

font-size:32px;
margin-bottom:10px;

}

.subtitle{

opacity:.85;
line-height:1.6;

margin-bottom:25px;

}

.challenge{

font-size:48px;
font-weight:bold;

margin:25px 0;

}

button{

width:100%;

padding:16px;

font-size:20px;

font-weight:700;

border:none;

border-radius:14px;

background:#005EB8;

color:white;

cursor:pointer;

}

button:hover{

background:#003087;

}

.hidden{

display:none;

}

.teamIcon{

font-size:80px;

margin-top:10px;

}

.teamName{

font-size:36px;

font-weight:900;

margin:10px 0;

}

.tableInfo{

margin-top:15px;

font-size:20px;

}

.loading{

font-size:22px;

margin-top:20px;

}

</style>

</head>

<body>

<div class="card">

<div id="start">

<div class="logo">🛡️</div>

<h1>Avengers Initiative</h1>

<p class="subtitle">

Welcome Recruit

<br><br>

Complete your S.H.I.E.L.D verification challenge
to discover your team.

</p>

<button onclick="generateChallenge()">

Begin Verification

</button>

</div>

<div id="challengeScreen"
class="hidden">

<h2>S.H.I.E.L.D Verification</h2>

<div id="challenge"
class="challenge"></div>

<button onclick="revealTeam()">

Reveal My Team

</button>

</div>

<div id="result"
class="hidden">

<div id="teamIcon"
class="teamIcon"></div>

<h2>WELCOME TO</h2>

<div id="teamName"
class="teamName"></div>

<div id="tableInfo"
class="tableInfo"></div>

</div>

</div>

<script>

const teams = {

1:{
name:"TEAM HULK",
icon:"💚",
table:"Table A"
},

2:{
name:"TEAM IRON MAN",
icon:"🤖",
table:"Table B"
},

3:{
name:"TEAM CAPTAIN AMERICA",
icon:"🛡️",
table:"Table C"
},

4:{
name:"TEAM BLACK PANTHER",
icon:"🐾",
table:"Table D"
},

5:{
name:"TEAM SPIDER-MAN",
icon:"🕸️",
table:"Table E"
}

};

let answer = 1;

function generateChallenge(){

document
.getElementById("start")
.classList.add("hidden");

document
.getElementById("challengeScreen")
.classList.remove("hidden");

answer =
Math.floor(Math.random()*5)+1;

const a =
Math.floor(Math.random()*50)+20;

const b =
a-answer;

document
.getElementById("challenge")
.innerHTML=
`${a} - ${b} = ?`;

}

function revealTeam(){

document
.getElementById("challengeScreen")
.classList.add("hidden");

setTimeout(()=>{

const team =
teams[answer];

document
.getElementById("teamName")
.innerText=
team.name;

document
.getElementById("teamIcon")
.innerText=
team.icon;

document
.getElementById("tableInfo")
.innerText=
`Proceed to ${team.table}`;

document
.getElementById("result")
.classList.remove("hidden");

},500);

}

</script>

</body>

</html>
